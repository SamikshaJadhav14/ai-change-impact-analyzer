<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impact Analyzer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap">
<style>
:root{--paper:#eef1f5;--panel:#fff;--ink:#14213d;--muted:#5b6780;--line:#cfd6e2;--accent:#2b59c3;--side:#14213d;
--high:#c2331f;--med:#c98512;--low:#2f7d5b;font-family:"Schibsted Grotesk",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);line-height:1.5;display:flex;min-height:100vh}
aside{width:220px;background:var(--side);color:#dfe6f7;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside h1{font-size:17px;margin:0 6px 18px;color:#fff;font-weight:800;line-height:1.2}
aside button{background:none;border:0;color:inherit;text-align:left;padding:9px 10px;border-radius:6px;font:inherit;cursor:pointer}
aside button.on,aside button:hover{background:#243456;color:#fff}
.mode{margin-top:auto;font-size:12px;color:#9fb0d6;padding:6px}.mode b{color:#fff}
main{flex:1;min-width:0;padding:28px 28px 64px;max-width:1120px}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}aside h1{margin:0 12px 0 0}.mode{display:none}main{padding:18px 14px}}
h2{font-size:18px;margin:0 0 12px}.sub{color:var(--muted);margin:0 0 18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--panel)}
.btn{padding:9px 16px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:18px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;font:inherit;cursor:pointer;color:var(--muted)}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:700}
.list{border:1px solid var(--line);border-radius:6px;background:var(--panel);max-height:280px;overflow:auto;margin-top:12px}
.pick{display:grid;grid-template-columns:70px 1fr auto;gap:12px;width:100%;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font:inherit;cursor:pointer}
.pick:hover{background:#f4f6fa}.pick code{color:var(--accent)}.pick small{color:var(--muted)}.pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg{padding:12px 14px;border-radius:6px;margin:14px 0}.err{background:#fbe9e6;color:var(--high)}.info{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
.steps{display:grid;gap:6px;margin:8px 0}.steps div{color:var(--muted)}.steps .done{color:var(--low)}.steps .now{color:var(--ink);font-weight:700}
.verdict{background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:6px;padding:20px;margin:0 0 4px}
.verdict.High{--c:var(--high)}.verdict.Medium{--c:var(--med)}.verdict.Low{--c:var(--low)}
.verdict h2{font-size:30px;margin:0;color:var(--c);font-weight:800}
.gauge{display:flex;gap:4px;margin:10px 0;max-width:340px}.gauge i{flex:1;height:10px;border-radius:2px;background:var(--line)}
.gauge i.on:nth-child(1){background:var(--low)}.gauge i.on:nth-child(2){background:var(--med)}.gauge i.on:nth-child(3){background:var(--high)}
.stats{display:flex;gap:26px;flex-wrap:wrap;color:var(--muted);margin-top:10px}.stats b{color:var(--ink);font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:860px){.grid{grid-template-columns:1fr}}
.item{border-top:1px solid var(--line);padding:9px 0}.item:first-of-type{border-top:0}
details summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all}
.badge{padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.High{background:var(--high)}.Medium{background:var(--med)}.Low{background:var(--low)}.must,.Test{background:var(--accent)}.should{background:#7a869c}
.ev{margin:4px 0 0;color:var(--muted);font-size:14px}ul.plain{margin:0;padding-left:18px}
.cmd{display:flex;gap:8px;align-items:center;background:#14213d;color:#e8eefc;border-radius:6px;padding:10px 12px;margin-bottom:12px}
.cmd code{flex:1}.cmd button{border:1px solid #5b6f9c;background:none;color:#fff;border-radius:4px;padding:3px 10px;cursor:pointer}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-top:1px solid var(--line);vertical-align:middle}
.map{overflow-x:auto}.map svg{min-width:900px;width:100%;height:auto}
svg text{font:12px "Schibsted Grotesk",system-ui,sans-serif;fill:var(--ink)}svg .h{font-weight:700;fill:var(--muted)}
svg rect.High{fill:#fbe9e6;stroke:var(--high)}svg rect.Medium{fill:#fcf1dc;stroke:var(--med)}svg rect.Low{fill:#e5f3ec;stroke:var(--low)}svg rect.Test{fill:#e7edfb;stroke:var(--accent)}
svg rect{stroke-width:1.5}svg path{fill:none;stroke:#9aa7c0;stroke-width:1.5;transition:opacity .15s}svg path.dim{opacity:.1}svg path.hot{stroke:var(--accent);stroke-width:2.5}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<aside>
  <h1>Impact<br>Analyzer</h1>
  <button id="nav-a" class="on">Analyze</button>
  <button id="nav-h">History</button>
  <div class="mode" id="mode"></div>
</aside>
<main>
  <section id="view-a">
    <h2>Analyze a change</h2>
    <p class="sub">Choose a Python repository on GitHub, then a commit or pull request.</p>
    <div class="row"><input id="repo" placeholder="https://github.com/owner/repo, owner/repo, or a commit link" aria-label="GitHub repository"><button class="btn" id="load">Load repository</button></div>
    <div id="picker" hidden>
      <div class="tabs" role="tablist"><button class="on" data-k="commits">Commits</button><button data-k="pulls">Pull requests</button></div>
      <div id="plist" class="list"></div>
      <div class="row" style="margin-top:12px"><input id="ref" placeholder="Or enter a commit SHA / PR number (e.g. 42)" aria-label="Commit SHA or PR number"><button class="btn alt" id="run">Analyze</button></div>
    </div>
    <div id="status"></div><div id="report"></div>
  </section>
  <section id="view-h" hidden><h2>Analysis history</h2><p class="sub">Previous analyses stored locally. Open one to view or download its report.</p><div id="hist"></div></section>
</main>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
const badge = l => el("span", "badge " + l, l);
async function api(url, opts) {
  let r; try { r = await fetch(url, opts); } catch { throw new Error("Cannot reach the analyzer server. Is it running?"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : j.detail?.[0]?.msg || r.statusText);
  return j;
}
const status = (t, c = "info") => { $("#status").replaceChildren(); if (t) $("#status").append(el("div", "msg " + c, t)); };
let repo = "", kind = "commits", loaded = {};

api("/api/health").then(h => $("#mode").innerHTML = "AI: <b>" + (h.ai ? "Claude" : "rule-based") + "</b><br>Webhook: <b>" + (h.webhook ? "on" : "off") + "</b>").catch(() => {});
function nav(a) { $("#view-a").hidden = !a; $("#view-h").hidden = a; $("#nav-a").classList.toggle("on", a); $("#nav-h").classList.toggle("on", !a); if (!a) history(); }
$("#nav-a").onclick = () => nav(true); $("#nav-h").onclick = () => nav(false);

$("#load").onclick = async () => {
  repo = $("#repo").value.trim();
  if (!repo) return status("Enter a GitHub repository URL first.", "err");
  const m = repo.match(/\/commit\/([0-9a-f]{7,40})/i), p = repo.match(/\/pull\/(\d+)/);
  if (m || p) return analyze(m ? { sha: m[1] } : { pr: +p[1] });
  loaded = {}; $("#report").replaceChildren(); $("#picker").hidden = true; status("Cloning repository and reading history (first run can take a minute)…");
  $("#load").disabled = true;
  try { await tab("commits"); $("#picker").hidden = false; status(""); } catch (e) { status(e.message, "err"); }
  $("#load").disabled = false;
};
$$(".tabs[role=tablist] button").forEach(b => b.onclick = () => tab(b.dataset.k).catch(e => status(e.message, "err")));
async function tab(k) {
  kind = k; $$(".tabs[role=tablist] button").forEach(b => b.classList.toggle("on", b.dataset.k === k));
  if (!loaded[k]) loaded[k] = await api("/api/" + k + "?repo=" + encodeURIComponent(repo));
  const box = $("#plist"); box.replaceChildren();
  if (!loaded[k].length) return box.append(el("div", "empty", k === "pulls" ? "This repository has no pull requests." : "No commits found."));
  loaded[k].forEach(c => {
    const b = el("button", "pick");
    if (k === "commits") { b.append(el("code", "", c.sha.slice(0, 7)), el("span", "", c.subject), el("small", "", c.author + " · " + c.date)); b.onclick = () => analyze({ sha: c.sha }); }
    else { b.append(el("code", "", "#" + c.number), el("span", "", c.title), el("small", "", c.state + " · " + c.author)); b.onclick = () => analyze({ pr: c.number }); }
    box.append(b);
  });
}
$("#run").onclick = () => {
  const v = $("#ref").value.trim().replace(/^#/, "");
  if (/^\d+$/.test(v) && v.length < 7) return analyze({ pr: +v });
  if (/^[0-9a-f]{7,40}$/i.test(v)) return analyze({ sha: v });
  status("Enter a commit SHA (7-40 hex characters) or a PR number.", "err");
};

const STEPS = ["Fetching the change", "Detecting changed code", "Building dependency graph", "Mapping impact", "AI risk analysis", "Preparing report"];
async function analyze(target) {
  $("#report").replaceChildren(); status("");
  const box = el("div", "card"); box.append(el("h2", "", "Analyzing…")); const st = el("div", "steps"); STEPS.forEach(s => st.append(el("div", "", "○ " + s))); box.append(st); $("#report").append(box);
  let i = 0; const tick = setInterval(() => { [...st.children].forEach((d, j) => { d.className = j < i ? "done" : j === i ? "now" : ""; d.textContent = (j < i ? "✓ " : j === i ? "● " : "○ ") + STEPS[j]; }); i = Math.min(i + 1, STEPS.length - 1); }, 1800);
  try {
    const r = await api("/api/analyze", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ repo, ...target }) });
    clearInterval(tick); render(r, $("#report")); $("#report").scrollIntoView({ behavior: "smooth" });
  } catch (e) { clearInterval(tick); $("#report").replaceChildren(); status(e.message, "err"); }
}

function map(r) {
  const NS = "http://www.w3.org/2000/svg", mk = (t, a = {}) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const cols = [["Changed", 0], ["Dependent (direct)", 1], ["Potentially affected", 2], ["Tests", 3]], W = 215, X = [8, 262, 516, 770], MAXR = 14;
  const by = cols.map(([, l]) => r.graph.nodes.filter(n => n.layer === l)), pos = {}, rows = Math.min(MAXR, Math.max(1, ...by.map(a => a.length)));
  const svg = mk("svg", { viewBox: `0 0 1000 ${rows * 36 + 50}`, role: "img", "aria-label": "Impact map" }), edges = mk("g"), nodes = mk("g"); svg.append(edges, nodes);
  cols.forEach(([t], c) => {
    svg.append(Object.assign(mk("text", { x: X[c], y: 16, class: "h" }), { textContent: t }));
    by[c].slice(0, MAXR).forEach((n, k) => {
      const y = 30 + k * 36, g = mk("g"), name = n.id.split("/").slice(-2).join("/"); pos[n.id] = { x: X[c], y };
      g.append(mk("rect", { x: X[c], y, width: W, height: 28, rx: 5, class: n.level }), Object.assign(mk("text", { x: X[c] + 10, y: y + 18 }), { textContent: name.length > 30 ? "…" + name.slice(-29) : name }), Object.assign(mk("title"), { textContent: n.id + " (" + n.level + ")" }));
      g.dataset.id = n.id; nodes.append(g);
    });
    if (by[c].length > MAXR) svg.append(Object.assign(mk("text", { x: X[c], y: 30 + MAXR * 36 + 8, class: "h" }), { textContent: "+" + (by[c].length - MAXR) + " more" }));
  });
  const paths = r.graph.edges.filter(e => pos[e.s] && pos[e.t]).map(e => {
    const a = pos[e.s], b = pos[e.t], x1 = a.x + W, y1 = a.y + 14, x2 = b.x, y2 = b.y + 14, m = (x1 + x2) / 2;
    const p = mk("path", { d: `M${x1} ${y1}C${m} ${y1} ${m} ${y2} ${x2} ${y2}` }); p.e = e; edges.append(p); return p;
  });
  [...nodes.children].forEach(g => { g.onmouseenter = () => paths.forEach(p => p.classList.add(p.e.s === g.dataset.id || p.e.t === g.dataset.id ? "hot" : "dim")); g.onmouseleave = () => paths.forEach(p => p.classList.remove("hot", "dim")); });
  const w = el("div", "map"); w.append(svg); return w;
}

function render(r, out) {
  out.replaceChildren();
  const lv = r.risk.level, c = r.commit, ref = c.pr ? "PR #" + c.pr : c.sha.slice(0, 7);
  const head = el("div", "row"); head.style.margin = "8px 0 14px";
  const t = el("div"); t.style.flex = 1; t.append(el("b", "", r.repo + " · " + ref), el("div", "ev", c.message.split("\n")[0] + " — " + c.author + ", " + c.date)); head.append(t);
  const link = (label, q, cls, extra) => { const a = el("a", "btn " + cls, label); a.href = `/api/history/${r.id}/report?${q}`; if (extra) a.target = "_blank"; return a; };
  const dl = link("Download report", "format=html&download=true", ""), md = link("Markdown", "format=md&download=true", "alt"), pr = link("Print / PDF view", "format=html", "alt", 1);
  head.append(dl, md, pr); out.append(head);

  const v = el("section", "verdict " + lv), g = el("div", "gauge"); ["Low", "Medium", "High"].forEach((n, i) => g.append(el("i", i <= ["Low", "Medium", "High"].indexOf(lv) ? "on" : "")));
  const stats = el("div", "stats"); [[r.changed.length, "files changed"], [r.affected.length, "components affected"], [r.apis.length, "APIs touched"], [r.tests.length, "tests suggested"], [r.stats.edges, "dependency links scanned"]]
    .forEach(([n, x]) => { const d = el("div"); d.append(el("b", "", n), " " + x); stats.append(d); });
  v.append(el("h2", "", lv + " impact risk (" + r.risk.score + "/100)"), g, el("p", "", r.ai.summary), stats);
  v.append(el("p", "ev", r.ai.source === "claude" ? "Explanations written by Claude from static analysis facts." : "Rule-based explanations. Set ANTHROPIC_API_KEY for AI-written analysis." + (r.ai.ai_error ? " (AI call failed: " + r.ai.ai_error + ")" : "")));
  out.append(v);

  const panes = {}, bar = el("div", "tabs"), body = el("div");
  const add = (k, label, node) => { const b = el("button", "", label); b.onclick = () => { $$(".tabs:not([role]) button").forEach(x => x.classList.remove("on")); b.classList.add("on"); body.replaceChildren(node); }; bar.append(b); if (!body.children.length) { b.classList.add("on"); body.append(node); } };
  const card = (title, ...kids) => { const d = el("div", "card"); if (title) d.append(el("h2", "", title)); d.append(...kids); return d; };
  const ul = a => { const u = el("ul", "plain"); a.forEach(x => u.append(el("li", "", x))); return u; };

  const ov = el("div", "grid"), rf = card("Risk factors");
  if (!r.factors.length) rf.append(el("p", "ev", "No notable risk factors detected."));
  r.factors.forEach(f => { const i = el("div", "item row"); i.append(badge(f.severity), el("span", "", f.text)); rf.append(i); });
  ov.append(rf, el("div", "", null));
  const side = ov.lastChild; side.append(card("Possible consequences", r.ai.consequences?.length ? ul(r.ai.consequences) : el("p", "ev", "None identified.")), card("Recommendations", ul(r.ai.recommendations || [])));
  if (r.ai.watch_out?.length) side.append(card("Watch out for", ul(r.ai.watch_out)));
  add("ov", "Overview", ov);

  add("map", "Impact map", card("Changed → Dependent → Potentially affected", r.graph.nodes.length > r.changed.length ? map(r) : el("div", "empty", "No other files depend on the changed code, so there is nothing to map."),
    Object.assign(el("div", "legend"), { innerHTML: "<span>Hover a node to trace its links.</span><span>Border colour = impact level</span>" })));

  const cp = card("Affected components"); if (!r.affected.length) cp.append(el("div", "empty", "No other Python files import the changed code within 3 hops."));
  r.affected.forEach(a => {
    const d = el("details", "item"), s = el("summary"); s.append(badge(a.level), el("code", "", a.path), el("span", "ev", a.distance === 1 ? "direct" : "indirect · " + a.distance + " hops")); d.append(s, el("p", "", r.ai.components[a.path] || ""), el("p", "ev", "Path: " + a.chain.join(" → ")));
    if (a.uses.length) d.append(el("p", "ev", "References: " + a.uses.join("; "))); cp.append(d);
  });
  if (r.apis.length) { const tb = el("table"); r.apis.forEach(a => { const tr = el("tr"); [badge(a.status === "changed" ? "High" : "Medium"), el("code", "", a.route), el("code", "", a.file + "::" + a.handler)].forEach(x => { const td = el("td"); td.append(x); tr.append(td); }); tb.append(tr); }); cp.append(el("h2", "", "API endpoints"), tb); }
  add("cp", "Components & APIs", cp);

  const ts = card("Recommended tests"), cmd = el("div", "cmd"), cb = el("button", "", "Copy"); cb.onclick = () => navigator.clipboard.writeText(r.command).then(() => cb.textContent = "Copied");
  cmd.append(el("code", "", r.command), cb); ts.append(cmd); if (!r.tests.length) ts.append(el("div", "empty", "No tests reference the changed code. Consider adding one."));
  r.tests.forEach(x => { const i = el("div", "item"), h = el("div", "row"); h.append(badge(x.priority), el("code", "", x.path)); i.append(h, el("p", "ev", x.reasons.join(" · "))); ts.append(i); });
  add("ts", "Tests", ts);

  const fl = card("Changed files");
  r.changed.forEach(f => { const i = el("div", "item"), h = el("div", "row"); h.append(badge(f.level), el("code", "", f.path)); const b = [{ A: "added", D: "deleted", R: "renamed" }[f.status] || "modified", "+" + f.adds + " −" + f.dels]; if (f.fan_in) b.push("imported by " + f.fan_in); if (f.symbols.length) b.push("touches " + f.symbols.join(", ")); i.append(h, el("p", "ev", b.join(" · "))); if (f.note) i.append(el("p", "ev", f.note)); fl.append(i); });
  add("fl", "Changed files", fl);
  out.append(bar, body);
}

async function history() {
  const box = $("#hist"); box.replaceChildren(el("p", "ev", "Loading…"));
  try {
    const h = await api("/api/history"); box.replaceChildren();
    if (!h.length) return box.append(el("div", "card empty", "No analyses yet. Run one from the Analyze page and it will appear here."));
    const tb = el("table"), c = el("div", "card"); c.append(tb); box.append(c);
    h.forEach(x => {
      const tr = el("tr"), cell = (...k) => { const td = el("td"); td.append(...k); tr.append(td); return td; };
      cell(badge(x.risk)); cell(el("b", "", x.repo), el("div", "ev", (x.pr ? "PR #" + x.pr : x.sha.slice(0, 7)) + " · " + x.title));
      cell(el("span", "ev", new Date(x.created * 1000).toLocaleString() + (x.source === "webhook" ? " · webhook" : "")));
      const o = el("button", "btn alt", "Open"), d = el("button", "btn alt", "Delete");
      o.onclick = async () => { try { const r = await api("/api/history/" + x.id); repo = r.repo; nav(true); $("#picker").hidden = true; status(""); render(r, $("#report")); } catch (e) { alert(e.message); } };
      d.onclick = async () => { if (confirm("Delete this analysis?")) { await api("/api/history/" + x.id, { method: "DELETE" }); history(); } };
      cell(o, " ", d); tb.append(tr);
    });
  } catch (e) { box.replaceChildren(el("div", "msg err", e.message)); }
}
</script>
</body>
</html>
